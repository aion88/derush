<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>derush studio</title>
<style>
  :root { --ink:#141414; --paper:#f4efe6; --mute:#8d877c; --cut:#c23b22; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 -apple-system, "Helvetica Neue", sans-serif; background:var(--paper); color:var(--ink); }
  header { padding:14px 28px; background:var(--ink); color:var(--paper); font-weight:600; }
  main { max-width:820px; margin:32px auto; padding:0 24px; }
  #drop { border:2px dashed #b9b2a6; border-radius:8px; padding:48px 24px; text-align:center; cursor:pointer; background:#fbf8f2; }
  #drop.over { border-color:var(--cut); background:#fff; }
  #drop b { display:block; font-size:20px; margin-bottom:6px; }
  #drop small { color:var(--mute); }
  .lang { margin-top:10px; font-size:14px; color:var(--mute); }
  #up { margin-top:12px; font-size:14px; }
  progress { width:100%; height:8px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:40px 0 10px; }
  .v { display:flex; align-items:center; gap:14px; padding:12px 14px; background:#fff; border-radius:6px; margin-bottom:8px; }
  .v .n { font-weight:600; flex:1; word-break:break-all; }
  .v .s { font-size:13px; color:var(--mute); }
  .v .j { font-size:12px; color:var(--mute); font-family:ui-monospace, monospace; display:block; white-space:pre-wrap; margin-top:4px; }
  .v .err { color:var(--cut); }
  a.b, button.b { font:inherit; font-size:14px; background:var(--ink); color:var(--paper); border:0; border-radius:4px; padding:6px 14px; text-decoration:none; cursor:pointer; }
</style>
</head>
<body>
<header>derush studio</header>
<main>
  <div id="drop">
    <b>Dépose ta vidéo brute ici</b>
    <small>ou clique pour la choisir · mov, mp4 · face caméra, la voix compte</small>
    <input type="file" id="file" accept="video/*" hidden>
  </div>
  <div class="lang">Langue parlée :
    <label><input type="radio" name="lang" value="fr" checked> français</label>
    <label><input type="radio" name="lang" value="en"> anglais</label>
  </div>
  <div id="up"></div>
  <h2>Tes vidéos</h2>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); };
file.onchange = () => file.files[0] && send(file.files[0]);

function send(f) {
  const lang = document.querySelector("input[name=lang]:checked").value;
  const x = new XMLHttpRequest();
  $("#up").innerHTML = `Envoi de ${f.name}… <progress id="pg" max="1" value="0"></progress>`;
  x.upload.onprogress = e => { if (e.lengthComputable) $("#pg").value = e.loaded / e.total; };
  x.onload = () => {
    const r = JSON.parse(x.responseText);
    $("#up").innerHTML = r.error ? `<span style="color:var(--cut)">${r.error}</span>` : `Reçue. Le derush tourne sur ${r.stem}, suis-le ci-dessous.`;
    refresh();
  };
  x.onerror = () => { $("#up").textContent = "Envoi en échec."; };
  x.open("POST", `/upload?name=${encodeURIComponent(f.name)}&lang=${lang}`);
  x.send(f);
}

const STATE = { "brut": "brute, derush à faire", "prêt": "derush fait, à monter au texte", "monté": "montée" };
async function refresh() {
  const vs = await fetch("/videos").then(r => r.json());
  $("#list").innerHTML = vs.length ? "" : "<p style='color:var(--mute)'>Aucune vidéo pour l'instant.</p>";
  vs.forEach(v => {
    const d = document.createElement("div"); d.className = "v";
    const j = v.job || {};
    let act = "";
    if (j.running) act = `<span class="s">${j.label}…</span>`;
    else if (v.state !== "brut") act = `<a class="b" href="/edit?v=${encodeURIComponent(v.stem)}">Ouvrir</a>`;
    const info = j.running ? `<span class="j">${(j.tail || []).slice(-2).join("\n")}</span>`
      : j.error ? `<span class="j err">En échec : ${(j.tail || []).slice(-3).join("\n")}</span>` : "";
    d.innerHTML = `<div class="n">${v.stem}<br><span class="s">${STATE[v.state] || v.state}</span>${info}</div>${act}`;
    $("#list").appendChild(d);
  });
}
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
